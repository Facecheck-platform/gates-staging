<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#0f172a">
<title>FaceCheck Gates</title>
<!-- FaceCheck Gates · Ingreso del socio · v1 (15/11/2026)
     Se abre escaneando el QR de UNA puerta: ingreso.html?c=<cliente>&p=<puerta>.
     Copia de la logica de camara y GPS de la pantalla de fichar de Jobs (no se toca aquella).
     La distancia se mide aca para avisar ANTES de sacar la foto (no se gasta nada) y el
     servidor la vuelve a medir: la decision de abrir es siempre del servidor. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.marca{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.marca svg{width:30px;height:21px}
.marca-txt{font-size:17px;font-weight:700;color:#e2e8f0;letter-spacing:-.2px}
.gates{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.6px;color:#0f172a;background:#38bdf8;border-radius:20px;padding:2px 8px;margin-left:2px;vertical-align:middle}
.cliente{font-size:1.7rem;font-weight:800;color:#fff;letter-spacing:4px;text-align:center;text-transform:uppercase;margin:4px 0 8px;line-height:1.15;word-break:break-word}
.locacion{font-size:1rem;color:#f1f5f9;padding:8px 20px;background:#1e3a5f;border-radius:20px;font-weight:600;margin-bottom:10px;text-align:center}
.gps-bar{padding:8px 14px;border-radius:20px;font-size:.82rem;font-weight:600;margin-bottom:12px;text-align:center}
.gps-wait{background:#1e3a5f;color:#93c5fd}
.gps-ok{background:#064e3b;color:#34d399}
.gps-err{background:#450a0a;color:#f87171}
.card{background:#1e293b;border-radius:16px;padding:18px;width:100%;max-width:420px;border:1px solid #334155;margin-bottom:14px}
#camBox{position:relative;width:100%;aspect-ratio:4/5;max-height:52vh;border-radius:12px;overflow:hidden;background:#0f172a;border:2px dashed #334155;cursor:pointer;-webkit-tap-highlight-color:transparent}
#camBox.on{border-style:solid;cursor:default}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)}
#canvas{display:none}
#camMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cbd5e1;font-weight:600;font-size:.95rem;text-align:center;padding:16px}
#camMsg svg{opacity:.7}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:12px;transition:background .2s}
.btn-ingresar{background:#0ea5e9;color:#fff}
.btn-ingresar:disabled{background:#334155;color:#64748b;cursor:not-allowed}
.result{display:none;width:100%;max-width:420px;border-radius:16px;padding:30px 22px;text-align:center;margin-bottom:14px}
.result.on{display:block}
.r-ok{background:#064e3b;border:2px solid #10b981}
.r-warn{background:#431407;border:2px solid #f97316}
.r-err{background:#450a0a;border:2px solid #ef4444}
.r-icon{font-size:4.2rem;line-height:1;margin-bottom:14px}
.r-tit{font-size:1.45rem;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.25}
.r-det{font-size:.95rem;color:#e2e8f0;line-height:1.5}
.btn-volver{background:rgba(255,255,255,.12);color:#fff;margin-top:20px}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.guia{display:none;width:100%;max-width:420px;background:#1e293b;border:2px solid #f97316;border-radius:16px;padding:16px;margin-bottom:14px;font-size:.9rem;line-height:1.55}
.guia ol{padding-left:20px;margin:8px 0}
.pie{font-size:.72rem;color:#64748b;margin-top:auto;padding-top:10px;text-align:center}
.staging-band{display:none}
body.staging .staging-band{display:flex;position:fixed;top:0;left:0;right:0;z-index:90;align-items:center;justify-content:center;gap:10px;height:30px;background:#f59e0b;color:#0f172a;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
body.staging{padding-top:46px}
</style>
</head>
<body>
<div class="staging-band" role="status">Entorno de pruebas · Gates</div>

<div class="marca" aria-label="FaceCheck Gates">
  <svg viewBox="0 0 96 66" fill="none" aria-hidden="true"><circle cx="26" cy="16" r="8" fill="#38bdf8"/><circle cx="56" cy="16" r="8" fill="#38bdf8"/><path d="M8 32 C16 54 30 66 40 62 C50 56 70 24 90 4" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/></svg>
  <span class="marca-txt">FaceCheck <span class="gates">GATES</span></span>
</div>
<div class="cliente" id="cliente">&nbsp;</div>
<div class="locacion" id="locacion">Cargando…</div>
<div class="gps-bar gps-wait" id="gpsBar">Buscando tu ubicación…</div>
<div class="guia" id="guia"></div>

<div class="card" id="card">
  <div id="camBox" role="button" tabindex="0" aria-label="Activar cámara">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="camMsg">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span id="camTxt">Tocá para activar la cámara</span>
    </div>
  </div>
  <button class="btn btn-ingresar" id="btnIngresar" disabled>Ingresar</button>
</div>

<div class="result" id="result" role="alert">
  <div class="r-icon" id="rIcon"></div>
  <div class="r-tit" id="rTit"></div>
  <div class="r-det" id="rDet"></div>
  <button class="btn btn-volver" id="btnVolver">Listo</button>
</div>

<div class="pie">FaceCheck Gates by Kama</div>

<script>
// ── Entorno: lo dice el dominio (mismo criterio que Jobs) ───────────────────
var ES_STAGING = location.hostname.indexOf('gates-staging.') === 0 || location.hostname === 'localhost' || location.protocol === 'file:';
var API_URL = ES_STAGING
  ? 'https://4niojadutxgkg3p4w5sfxhdgyi0uvwzn.lambda-url.us-east-2.on.aws'
  : 'https://PROD_URL_PENDIENTE.lambda-url.us-east-2.on.aws';
if (ES_STAGING) document.body.classList.add('staging');

var q = new URLSearchParams(location.search);
var CLIENT_ID = q.get('c') || '', PUERTA_ID = q.get('p') || '';
var PUERTA = null;                     // {lat, lng, radioM, locacion, nombreCliente}
var pos = null, acc = null, lecturas = [], watchId = null, iosTimer = null;
var stream = null, enviando = false, distancia = null, timerVolver = null;
var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

var $ = function (id) { return document.getElementById(id); };

function setGPS(tipo, txt) { var b = $('gpsBar'); b.className = 'gps-bar gps-' + tipo; b.textContent = txt; }
function haversine(a, b, c, d) {
  var R = 6371000, dLat = (c - a) * Math.PI / 180, dLng = (d - b) * Math.PI / 180;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function enRango() { return distancia !== null && PUERTA && distancia <= PUERTA.radioM; }
function actualizarBoton() { $('btnIngresar').disabled = enviando || !PUERTA || !pos; }

// ── Puerta ───────────────────────────────────────────────────────────────────
async function cargarPuerta() {
  if (!CLIENT_ID || !PUERTA_ID) { fatal('Este código QR no es válido.'); return; }
  try {
    var r = await fetch(API_URL + '/puerta?clientId=' + encodeURIComponent(CLIENT_ID) + '&puerta=' + encodeURIComponent(PUERTA_ID), { credentials: 'omit' });
    var d = await r.json();
    if (!r.ok || !d.ok) { fatal(r.status === 404 ? 'Esta puerta no está habilitada.' : (d.error || 'No se pudo cargar la puerta.')); return; }
    PUERTA = { lat: parseFloat(d.lat), lng: parseFloat(d.lng), radioM: d.radioM || 100, locacion: d.locacion || '' };
    $('cliente').textContent = d.nombreCliente || '';
    $('locacion').textContent = d.locacion || 'Ingreso';
    document.title = (d.nombreCliente ? d.nombreCliente + ' · ' : '') + 'FaceCheck Gates';
    if (pos) evaluarPos();
    actualizarBoton();
  } catch (e) { fatal('No hay conexión. Revisá internet y volvé a escanear el QR.'); }
}
function fatal(msg) {
  $('locacion').textContent = 'No disponible';
  $('card').style.display = 'none';
  setGPS('err', msg);
  pararGPS();
}

// ── GPS (copia de Jobs: watchPosition + refresco en iOS + guia de permisos) ───
function evaluarPos() {
  if (!PUERTA || !pos) return;
  distancia = Math.round(haversine(pos[0], pos[1], PUERTA.lat, PUERTA.lng));
  if (enRango()) setGPS('ok', 'En la puerta · ' + distancia + ' m');
  else setGPS('err', 'Estás a ' + distancia + ' m de la puerta (máx. ' + PUERTA.radioM + ' m)');
}
function nuevaLectura(p) {
  pos = [p.coords.latitude, p.coords.longitude]; acc = p.coords.accuracy;
  lecturas.push(pos); if (lecturas.length > 12) lecturas.shift();
  $('guia').style.display = 'none';
  evaluarPos(); actualizarBoton();
}
function iniciarGPS() {
  if (!navigator.geolocation) { setGPS('err', 'Este teléfono no tiene GPS disponible'); return; }
  var opt = { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 };
  watchId = navigator.geolocation.watchPosition(nuevaLectura, errorGPS, opt);
  if (esIOS) iosTimer = setInterval(function () { navigator.geolocation.getCurrentPosition(nuevaLectura, function () {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }); }, 3500);
}
function pararGPS() {
  try { if (watchId !== null) navigator.geolocation.clearWatch(watchId); } catch (e) {}
  watchId = null; if (iosTimer) { clearInterval(iosTimer); iosTimer = null; }
}
function errorGPS(err) {
  if (err && err.code === 1) { setGPS('err', 'Ubicación bloqueada'); guiaGPS(); pararGPS(); return; }
  if (!pos) setGPS('wait', 'Buscando señal… acercate a una ventana');
}
function guiaGPS() {
  var ua = navigator.userAgent, h;
  if (/iPhone|iPad|iPod/.test(ua)) h = '<b>Tu iPhone no le da la ubicación a esta página.</b><ol><li>Ajustes → Privacidad y seguridad → Localización: activada.</li><li>Entrá a <b>' + (/CriOS/.test(ua) ? 'Chrome' : 'Sitios web de Safari') + '</b> → <b>Al usarse la app</b> y prendé <b>Ubicación exacta</b>.</li><li>Volvé y tocá Reintentar.</li></ol>';
  else if (/Android/.test(ua)) h = '<b>El teléfono no le da la ubicación a esta página.</b><ol><li>Prendé <b>Ubicación</b> en la barra de arriba.</li><li>En Chrome: ícono a la izquierda de la dirección → Permisos → Ubicación → Permitir.</li><li>Tocá Reintentar.</li></ol>';
  else h = '<b>El navegador no le da la ubicación a esta página.</b> Permitila en la configuración del sitio y tocá Reintentar.';
  var g = $('guia'); g.innerHTML = h + '<button class="btn btn-ingresar" onclick="location.reload()">Reintentar</button>'; g.style.display = 'block';
}

// ── Camara (frontal siempre: la persona se valida a si misma) ────────────────
function activarCam() {
  if (stream) return Promise.resolve(true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('camTxt').textContent = 'Tu navegador no permite usar la cámara. Usá Chrome o Safari actualizado.'; return Promise.resolve(false); }
  $('camTxt').textContent = 'Activando cámara…';
  var pedir = function (c) { return navigator.mediaDevices.getUserMedia({ video: c, audio: false }); };
  return pedir({ facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 800 } })
    .catch(function () { return pedir(true); })
    .then(function (s) {
      stream = s; var v = $('video'); v.srcObject = s; v.style.display = 'block';
      var p = v.play(); if (p) p.catch(function () {});
      $('camMsg').style.display = 'none'; $('camBox').classList.add('on');
      return true;
    })
    .catch(function (e) { $('camTxt').textContent = 'No se pudo usar la cámara. Revisá el permiso y tocá de nuevo.'; return false; });
}
function apagarCam() {
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  stream = null; $('video').style.display = 'none'; $('camBox').classList.remove('on');
  $('camMsg').style.display = 'flex'; $('camTxt').textContent = 'Tocá para activar la cámara';
}
function foto() {
  var v = $('video'), c = $('canvas');
  var w = v.videoWidth || 640, h = v.videoHeight || 800, max = 800;
  var k = Math.min(1, max / Math.max(w, h));
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}

// ── Ingreso ──────────────────────────────────────────────────────────────────
async function ingresar() {
  if (enviando || !PUERTA) return;
  if (!pos) { setGPS('wait', 'Todavía buscamos tu ubicación… esperá unos segundos'); return; }
  // Lejos de la puerta: se avisa aca y no se manda nada (no se gasta reconocimiento).
  if (!enRango()) { mostrar('warn', '📍', 'Acercate a la puerta', 'Estás a ' + distancia + ' m. Tenés que estar a menos de ' + PUERTA.radioM + ' m para ingresar.'); return; }
  enviando = true; actualizarBoton();
  var btn = $('btnIngresar'); btn.innerHTML = '<span class="spinner"></span>Verificando…';
  try {
    if (!stream) { var ok = await activarCam(); if (!ok) return; await new Promise(function (r) { setTimeout(r, 1200); }); }
    var img = foto();
    var r = await fetch(API_URL + '/ingreso', { method: 'POST', credentials: 'omit',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: CLIENT_ID, puerta: PUERTA_ID, imageBase64: img,
                             lat: pos[0], lng: pos[1], accuracy: acc, lecturas: lecturas.slice() }) });
    var d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 429) { mostrar('warn', '⏳', 'Demasiados intentos', 'Esperá un momento y volvé a probar.'); return; }
    if (!r.ok && !d.resultado) { mostrar('err', '⚠️', 'No se pudo verificar', d.error || 'Probá de nuevo en unos segundos.'); return; }
    var res = d.resultado || '', msg = d.mensaje || '';
    if (res === 'ok' || res === 'reapertura') mostrar('ok', '✅', msg, 'Puerta abierta. Pasá.');
    else if (res === 'error_puerta') mostrar('warn', '🚪', 'Te reconocimos, pero la puerta no respondió', 'Avisá en recepción.');
    else if (res === 'no_reconocido' || res === 'sin_rostro') mostrar('err', '🙂', msg, 'Mirá a la cámara, con buena luz y sin anteojos de sol.');
    else if (res === 'fuera_de_rango') mostrar('warn', '📍', 'Acercate a la puerta', msg);
    else mostrar('err', '⛔', msg || 'No podés ingresar', 'Acercate a recepción.');
  } catch (e) {
    mostrar('err', '📶', 'Sin conexión', 'Revisá internet y volvé a probar.');
  } finally {
    enviando = false; btn.textContent = 'Ingresar'; actualizarBoton();
  }
}
function mostrar(tipo, icono, titulo, detalle) {
  apagarCam();
  $('card').style.display = 'none';
  var b = $('result'); b.className = 'result on r-' + tipo;
  $('rIcon').textContent = icono; $('rTit').textContent = titulo; $('rDet').textContent = detalle || '';
  clearTimeout(timerVolver);
  timerVolver = setTimeout(volver, tipo === 'ok' ? 8000 : 15000);
}
function volver() {
  clearTimeout(timerVolver);
  $('result').className = 'result';
  $('card').style.display = 'block';
}

$('camBox').addEventListener('click', activarCam);
$('camBox').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') activarCam(); });
$('btnIngresar').addEventListener('click', ingresar);
$('btnVolver').addEventListener('click', volver);
document.addEventListener('visibilitychange', function () { if (document.hidden) apagarCam(); });

cargarPuerta();
iniciarGPS();
</script>
</body>
</html>
